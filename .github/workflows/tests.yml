name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package with dev and web extras
        # PyPI drops a request now and again, and the run goes red with nothing
        # wrong in the tree. One job died here after 39 seconds on "Could not
        # find a version that satisfies the requirement setuptools>=61.0 (from
        # versions: none)" -- no index reached at all -- while the same commit
        # passed on the run before it and the run after. Two extra attempts
        # cost nothing when the first one works, and stop a dropped connection
        # from being reported as a failing test.
        run: |
          for attempt in 1 2 3; do
            if pip install -e ".[dev,web]"; then exit 0; fi
            echo "::warning::pip install failed on attempt ${attempt}, retrying in 15s"
            sleep 15
          done
          exit 1

      - name: Run tests
        run: pytest -q
